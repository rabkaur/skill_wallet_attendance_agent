<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance & Engagement Agent</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mut:#6b7385;--ac:#4f46e5;--bd:#e3e6ef}
@media(prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1b1f2b;--tx:#e8eaf2;--mut:#98a0b5;--ac:#818cf8;--bd:#2b3040}}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;flex-wrap:wrap;gap:8px}
h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:0 24px 24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}.card h2{font-size:14px;color:var(--mut);margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:34px;font-weight:700}.wide{grid-column:1/-1}button,a.btn{background:var(--ac);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;font-size:14px}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--bd)}
canvas{width:100%;height:220px}li{margin:6px 0}.pill{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd)}
</style></head><body>
<header><h1>Multimodal Attendance & Engagement Agent</h1>
<div><button onclick="post('start')">Start session</button> <button class="s" onclick="post('stop')">Stop</button> <a class="btn" href="/api/attendance.csv">Export CSV</a></div></header>
<main>
<div class="card"><h2>Attendance</h2><div class="big" id="pres">0</div><div id="det" style="color:var(--mut)">0 currently detected</div></div>
<div class="card"><h2>Engagement (latest window)</h2><div class="big" id="score">–</div><div id="sub" style="color:var(--mut)"></div></div>
<div class="card"><h2>Audio interaction</h2><div class="big" id="aud">0%</div><div style="color:var(--mut)">speech activity, last 10 s</div></div>
<div class="card wide"><h2>Engagement trend</h2><canvas id="ch"></canvas></div>
<div class="card"><h2>AI teaching suggestions</h2><ul id="sug"></ul></div>
<div class="card"><h2>Attendance log</h2><table><thead><tr><th>Learner</th><th>Marked</th><th>Last seen</th></tr></thead><tbody id="log"></tbody></table></div>
</main>
<script>
const $=id=>document.getElementById(id);
const post=u=>fetch('/api/'+u,{method:'POST'});
function draw(w){const c=$('ch'),r=devicePixelRatio||1;c.width=c.clientWidth*r;c.height=c.clientHeight*r;const g=c.getContext('2d');g.scale(r,r);
 const W=c.clientWidth,H=c.clientHeight,st=getComputedStyle(document.body);g.clearRect(0,0,W,H);g.strokeStyle=st.getPropertyValue('--bd');g.fillStyle=st.getPropertyValue('--mut');g.font='11px system-ui';
 for(let v=0;v<=100;v+=25){const y=H-20-(H-30)*v/100;g.beginPath();g.moveTo(30,y);g.lineTo(W,y);g.stroke();g.fillText(v,2,y+4)}
 if(!w.length)return;g.strokeStyle=st.getPropertyValue('--ac');g.lineWidth=2;g.beginPath();
 w.forEach((p,i)=>{const x=30+(W-40)*(w.length==1?.5:i/(w.length-1)),y=H-20-(H-30)*p.score/100;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
 w.forEach((p,i)=>{const x=30+(W-40)*(w.length==1?.5:i/(w.length-1));g.fillText(p.ts.slice(3),x-14,H-4)})}
async function tick(){try{const s=await (await fetch('/api/state')).json(),a=Object.entries(s.attendance),w=s.windows,l=w[w.length-1];
 $('pres').textContent=a.length;$('det').textContent=s.students.length+' currently detected'+(s.running?'':' (session stopped)');
 $('score').textContent=l?l.score:'–';$('sub').textContent=l?`attention ${l.attention}% · inactive ${l.inactivity}%`:'collecting first window…';
 $('aud').textContent=Math.round(s.audio*100)+'%';
 $('sug').innerHTML=s.suggestions.map(t=>`<li>${t}</li>`).join('')||'<li style="color:var(--mut)">Suggestions appear after the first window.</li>';
 $('log').innerHTML=a.map(([k,v])=>`<tr><td>${k}</td><td>${v.marked_at}</td><td>${v.last_seen}</td></tr>`).join('');draw(w)}catch(e){}}
setInterval(tick,2000);tick();
</script></body></html>
